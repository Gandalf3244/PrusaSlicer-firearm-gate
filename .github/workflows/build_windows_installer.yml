name: Windows installer (firearm gate)

# Builds PrusaSlicer with the firearm gate on a Windows runner, assembles the
# self-contained checker runtime, tests the gate on Windows, and produces
# PrusaSlicer-FirearmGate-<version>-win64.exe as a workflow artifact.
#
# The dependency bundle takes ~1 h the first time and is cached afterwards, so a
# run is ~40 min (the PrusaSlicer compile). Path filters do not apply to tag
# pushes, so a gate-v* tag always builds and publishes its release.

on:
  workflow_dispatch:
  push:
    branches: [firearm-gate]
    tags: ["gate-v*"]
    # documentation-only pushes do not need a 40-minute build
    paths-ignore:
      - "**.md"
      - "doc/**"

# contents: write is needed to create the release for a gate-v* tag
permissions:
  contents: write

env:
  # CMake 4 refuses the old cmake_minimum_required in Eigen / OCCT / Boost of the deps bundle
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  VERSION: "2.9.6"

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      # restore + explicit save (instead of actions/cache, which only saves when the
      # whole job succeeds) so the ~1 h dependency bundle survives a failure later on.
      # The key must leave out deps/build/** - the save step runs after the build has
      # filled it, so hashing it would never reproduce the key restore looked for;
      # restore-keys reuses a bundle saved under any deps-win64-* key.
      - name: Restore dependency bundle
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: deps\build\destdir
          key: deps-win64-${{ hashFiles('deps/**', '!deps/build/**') }}
          restore-keys: deps-win64-

      - name: Build dependencies
        if: steps.deps-cache.outputs.cache-matched-key == ''
        shell: cmd
        run: |
          mkdir deps\build
          cd deps\build
          cmake .. -G "Visual Studio 17 2022" -A x64 -DDEP_DEBUG=OFF
          if errorlevel 1 exit /b 1
          cmake --build . --config Release -- /m
          if errorlevel 1 exit /b 1
          rmdir /s /q dep_Boost-prefix dep_OCCT-prefix dep_OpenVDB-prefix dep_wxWidgets-prefix 2>nul

      - name: Save dependency bundle
        if: steps.deps-cache.outputs.cache-matched-key == ''
        uses: actions/cache/save@v4
        with:
          path: deps\build\destdir
          key: deps-win64-${{ hashFiles('deps/**', '!deps/build/**') }}

      - name: Build PrusaSlicer
        shell: cmd
        run: |
          rem the "x64 Native Tools" environment: without it LIB / WindowsSdkDir are unset, so
          rem find_library(Psapi) fails and the Win10 SDK STL-fixing service is not compiled in
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          mkdir build
          cd build
          rem Release only: the deps carry no Debug libs (DEP_DEBUG=OFF) and FindOpenVDB on
          rem MSVC insists on libopenvdbd.lib whenever "Debug" is among the configuration types
          cmake .. -G "Visual Studio 17 2022" -A x64 -DCMAKE_CONFIGURATION_TYPES=Release -DCMAKE_PREFIX_PATH="%GITHUB_WORKSPACE%\deps\build\destdir\usr\local"
          if errorlevel 1 exit /b 1
          cmake --build . --config Release --target PrusaSlicer_app_gui PrusaSlicer_app_console PrusaSlicer_app_gcodeviewer PrusaSlicerDllsCopy -- /m
          if errorlevel 1 exit /b 1
          dir src\Release

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Assemble checker runtime
        run: python packaging\windows\make_checker_runtime.py firearm-check checker-runtime

      # The repository ships no firearm models, so both test parts are generated: a plain
      # box (must slice) and a box drilled with the exact hole pattern of one shipped
      # fingerprint (must be refused; packaging/windows/make_test_part.py). Neither is a
      # gun part; the second carries a reference part's hole constellation.
      - name: Prepare test parts
        shell: bash
        run: |
          python -m pip install --quiet numpy scipy trimesh networkx manifold3d
          mkdir -p testparts
          python -c "import trimesh; trimesh.creation.box((30, 20, 10)).export('testparts/allowed_box.stl')"
          python packaging/windows/make_test_part.py firearm-check testparts/blocked.stl
          # a plate with an open (non-watertight) body: the checker splits the plate into
          # bodies, which exercises trimesh's hole repair (needs networkx in the runtime)
          python -c "import trimesh; a = trimesh.creation.icosphere(subdivisions=3, radius=10); a.update_faces(list(range(20, len(a.faces)))); b = trimesh.creation.box((20, 20, 20)); b.apply_translation([40, 0, 0]); trimesh.util.concatenate([a, b]).export('testparts/open_plate.stl')"

      - name: Test checker runtime on Windows
        shell: cmd
        run: |
          cd checker-runtime\app
          ..\python\python.exe -m pipeline.check --json --units mm ..\..\testparts\allowed_box.stl
          if errorlevel 1 ( echo expected ALLOW & exit /b 1 )
          ..\python\python.exe -m pipeline.check --json --units mm ..\..\testparts\open_plate.stl
          if errorlevel 1 ( echo expected ALLOW for a plate with an open body & exit /b 1 )
          ..\python\python.exe -m pipeline.check --json --units mm ..\..\testparts\blocked.stl
          if not errorlevel 2 ( echo expected BLOCK & exit /b 1 )
          exit /b 0

      - name: Stage and build installer
        run: python packaging\windows\build_installer.py --build build\src\Release --source . --checker checker-runtime --out installer --version ${{ env.VERSION }}

      - name: Test the gate end to end (staged PrusaSlicer + bundled checker)
        shell: cmd
        run: |
          set PS=installer\stage\prusa-slicer-console.exe
          rem diagnostics first: what the staged DLL imports, the Win32 error if it does not load
          rem (126 = a dependency is missing, 1114 = DllMain / static init failed), and whether
          rem the same binary runs from the build directory
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat" >nul
          dumpbin /nologo /dependents installer\stage\PrusaSlicer.dll
          python -c "import ctypes,os,sys; p=os.path.abspath(r'installer\stage\PrusaSlicer.dll'); os.add_dll_directory(os.path.dirname(p)); ctypes.WinDLL(p); print('ctypes: PrusaSlicer.dll loads')" || echo ctypes: PrusaSlicer.dll does NOT load
          build\src\Release\prusa-slicer-console.exe --help > help.txt 2>&1
          echo build-dir exe exit code %errorlevel% & type help.txt | findstr /N /C:"" | findstr /B "[1-5]:"
          %PS% --export-gcode --output allowed.gcode testparts\allowed_box.stl > allowed.txt 2>&1
          if errorlevel 1 ( type allowed.txt & exit /b 1 )
          if not exist allowed.gcode ( echo no G-code for an allowed part & exit /b 1 )
          %PS% --export-gcode --output blocked.gcode testparts\blocked.stl > blocked.txt 2>&1
          if not errorlevel 1 ( echo expected refusal & type blocked.txt & exit /b 1 )
          findstr /C:"Slicing refused" blocked.txt || ( type blocked.txt & exit /b 1 )
          if exist blocked.gcode ( echo G-code was written for a blocked part & exit /b 1 )
          type blocked.txt
          exit /b 0

      # A stock PrusaSlicer left next to the gated one would slice anything, so the installer
      # must remove it. Fake stock installs: one registered in Add/Remove Programs whose
      # uninstaller fails (the installer must refuse), then one that uninstalls, plus an
      # unregistered copy in the standard folder.
      - name: Test the installer removes a stock PrusaSlicer
        shell: cmd
        run: |
          set SETUP=installer\PrusaSlicer-FirearmGate-%VERSION%-win64.exe
          set KEY=HKLM\Software\Microsoft\Windows\CurrentVersion\Uninstall\PrusaSlicerStockTest
          set PORTABLE=C:\Program Files\Prusa3D\PrusaSlicer
          set GATED=C:\Program Files\PrusaSlicer-FirearmGate
          mkdir C:\StockPrusa "%PORTABLE%"
          copy installer\stage\prusa-slicer*.exe C:\StockPrusa\
          copy installer\stage\prusa-slicer*.exe "%PORTABLE%\"
          reg add %KEY% /reg:64 /f /v DisplayName /d "PrusaSlicer 2.9.4"
          reg add %KEY% /reg:64 /f /v InstallLocation /d C:\StockPrusa
          reg add %KEY% /reg:64 /f /v UninstallString /d "cmd.exe /c exit 1"

          start /wait "" %SETUP% /S
          if not errorlevel 1 ( echo installed although the stock PrusaSlicer could not be removed & exit /b 1 )
          if exist "%GATED%\prusa-slicer.exe" ( echo installed although the stock PrusaSlicer could not be removed & exit /b 1 )

          reg add %KEY% /reg:64 /f /v QuietUninstallString /d "reg.exe delete %KEY% /reg:64 /f"
          start /wait "" %SETUP% /S
          if errorlevel 1 ( echo installer failed & exit /b 1 )
          reg query %KEY% /reg:64 && ( echo stock uninstall entry still there & exit /b 1 )
          if exist C:\StockPrusa\prusa-slicer.exe ( echo registered stock copy still there & exit /b 1 )
          if exist "%PORTABLE%\prusa-slicer.exe" ( echo unregistered stock copy still there & exit /b 1 )
          if not exist "%GATED%\prusa-slicer-console.exe" ( echo gated PrusaSlicer not installed & exit /b 1 )
          reg query HKLM\Software\Classes\Prusa.Slicer.1\Shell\Open\Command | findstr /C:"PrusaSlicer-FirearmGate" || ( echo .3mf/.stl not associated & exit /b 1 )

          "%GATED%\prusa-slicer-console.exe" --export-gcode --output installed.gcode testparts\blocked.stl > installed.txt 2>&1
          if not errorlevel 1 ( echo installed copy did not refuse & type installed.txt & exit /b 1 )
          findstr /C:"Slicing refused" installed.txt || ( type installed.txt & exit /b 1 )
          exit /b 0

      # keep the installer even when the headless end-to-end test fails, so it can be tried on a real PC
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: PrusaSlicer-FirearmGate-${{ env.VERSION }}-win64
          path: installer\PrusaSlicer-FirearmGate-*.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/gate-v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer\PrusaSlicer-FirearmGate-*.exe
